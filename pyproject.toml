[project]
name = "oarepo-app"
version = "8.0.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Miroslav Simek", email = "3385642+mesemus@users.noreply.github.com" },
]
requires-python = ">=3.14"
dependencies = [
    "json5",
]

[project.urls]
Homepage = "https://github.com/oarepo/oarepo-app"

[project.optional-dependencies]
ccmm-development = [
    "ccmm-invenio>=1.1.0,<1.2.0",
]
oaipmh-harvester-development = [
    "oarepo-oai-pmh-harvester>=9.6.1,<10.0.0",
]
llm-development = [
    "oarepo-checks>=3.0.0,<4.0.0",
]
ark-development = [
    "oarepo-ark>=1.0.0,<2.0.0",
]
antivirus-development = [
    "oarepo-antivirus>=1.0.1,<2.0.0",
]
development = [
    "oarepo[s3]>=14.2.7,<15.0.0",
    "marshmallow-i18n-messages>=0.1.0,<1.0.0",
    "oarepo-config>=3.0.0,<4.0.0",
    "oarepo-communities>=14.0.0,<15.0.0",
    "oarepo-dashboard>=9.0.0,<10.0.0",
    "oarepo-glitchtip>=1.3.1,<2.0.0",
    "oarepo-invenio-typing-stubs>=0.1.46,<1.0.0",
    "oarepo-model>=7.0.0,<8.0.0",
    "oarepo-oidc-einfra>=9.0.0,<10.0.0",
    "oarepo-rdm>=10.0.0,<11.0.0",
    "oarepo-requests>=11.0.0,<12.0.0",
    "oarepo-runtime>=8.0.0,<9.0.0",
    "oarepo-theme>=7.0.0,<8.0.0",
    "oarepo-ui>=14.0.0,<15.0.0",
    "oarepo-vocabularies>=11.0.0,<12.0.0",
    "oarepo-workflows>=9.0.0,<10.0.0",
    "oarepo-doi>=8.0.0,<9.0.0",
    "oarepo-related-resources>=7.0.0,<8.0.0",
    "oarepo-previewer>=1.0.2,<2.0.0",
    "oarepo-formats>=1.0.2,<2.0.0",
    "pygelf>=0.4.0,<1.0.0",
    "oarepo-kerberos>=0.2.0,<1.0.0",
]
oarepo14 = [
    "oarepo[rdm,tests]>=14.0.0,<15.0.0",
]
tests = [
    "pytest",
    "pytest-oarepo>=7.0.0,<8.0.0",
]
ark = [
    "oarepo-ark==1.0.0",
]
antivirus = [
    "oarepo-antivirus==1.0.1",
]
production = [
    "oarepo[s3]==14.2.7+4.rdm.14.0.6",
    "marshmallow-i18n-messages==0.4.1",
    "oarepo-config==3.0.0",
    "oarepo-communities==14.0.0",
    "oarepo-dashboard==9.0.0",
    "oarepo-glitchtip==1.3.1",
    "oarepo-invenio-typing-stubs==0.1.46",
    "oarepo-model==7.0.0",
    "oarepo-oidc-einfra==9.0.0",
    "oarepo-rdm==10.0.0",
    "oarepo-requests==11.0.0",
    "oarepo-runtime==8.0.0",
    "oarepo-theme==7.0.0",
    "oarepo-ui==14.0.0",
    "oarepo-vocabularies==11.0.0",
    "oarepo-workflows==9.0.0",
    "oarepo-doi==8.0.0",
    "oarepo-related-resources==7.0.0",
    "oarepo-previewer==1.0.2",
    "oarepo-formats==1.0.2",
    "pygelf==0.4.3",
    "oarepo-kerberos==0.2.0",
]
ccmm = [
    "ccmm-invenio==2.6.1",
]
oaipmh-harvester = [
    "oarepo-oai-pmh-harvester==9.6.1",
]
llm = [
    "oarepo-checks==3.0.0",
]

[project.entry-points."invenio_config.module"]
oarepo_app = "oarepo_app.workarounds"

[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/oarepo_app",
]

[tool.hatch.build.targets.sdist]
include = [
    "src/oarepo_app",
]

[tool.oarepo]
default_extras = "development,tests,oarepo14"

[tool.oarepo.github.01-ccmm]
org = "nrp-cz"
include = "ccmm-invenio"
branch = "main"

[tool.oarepo.github.02-oarepo]
org = "oarepo"
package = "oarepo-invenio-typing-stubs"
repository = "invenio-typing-stubs"

[tool.oarepo.github.03-oarepo]
org = "oarepo"
package = "oarepo-oai-pmh-harvester"
repository = "oarepo-oaipmh-harvester"

[tool.oarepo.github.04-oarepo]
org = "oarepo"
include = "oarepo-.*"
branch = "main"

[tool.uv.sources]
