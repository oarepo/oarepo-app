[project]
name = "oarepo-app"
version = "6.2.0rc3"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Miroslav Simek", email = "3385642+mesemus@users.noreply.github.com" },
]
requires-python = ">=3.14"
dependencies = [
    "json5",
]

[project.urls]
Homepage = "https://github.com/oarepo/oarepo-app"

[project.optional-dependencies]
ccmm-development = [
    "ccmm-invenio>=1.1.0,<1.2.0",
]
oaipmh-harvester-development = [
    "oarepo-oai-pmh-harvester>=9.0.0,<10.0.0",
]
llm-development = [
    "oarepo-checks>=1.0.0,<2.0.0"
]
development = [
    "oarepo[s3]>=14.2.1b11.dev4,<15.0.0",
    "marshmallow-i18n-messages>=0.1.0,<1.0.0",
    "oarepo-communities>=10.0.1,<11.0.0",
    "oarepo-dashboard>=7.0.0,<8.0.0",
    "oarepo-glitchtip>=1.3.0,<2.0.0",
    "oarepo-invenio-typing-stubs>=0.1.32,<1.0.0",
    "oarepo-model>=4.0.0,<5.0.0",
    "oarepo-oidc-einfra>=6.0.0,<7.0.0",
    "oarepo-rdm>=7.0.0,<8.0.0",
    "oarepo-requests>=8.0.0,<9.0.0",
    "oarepo-runtime>=6.0.0,<7.0.0",
    "oarepo-theme>=5.0.0,<6.0.0",
    "oarepo-ui>=12.0.0,<13.0.0",
    "oarepo-vocabularies>=8.0.0,<9.0.0",
    "oarepo-workflows>=6.0.1,<7.0.0",
    "oarepo-doi>=6.0.0,<7.0.0",
    "oarepo-related-resources>=3.0.0,<4.0.0",
]
oarepo14 = [
    "oarepo[rdm,tests]>=14.0.0,<15.0.0",
]
tests = [
    "pytest",
    "pytest-oarepo>=6.0.1,<7.0.0",
]
production = [
    "oarepo[s3]==14.2.1b11.dev4+2.rdm.14.0.0b11.dev4",
    "marshmallow-i18n-messages==0.4.0",
    "oarepo-communities==10.0.1",
    "oarepo-dashboard==7.0.0",
    "oarepo-glitchtip==1.3.0",
    "oarepo-invenio-typing-stubs==0.1.32",
    "oarepo-model==4.0.0",
    "oarepo-oidc-einfra==6.0.0",
    "oarepo-rdm==7.0.0",
    "oarepo-requests==8.0.0",
    "oarepo-runtime==6.0.0",
    "oarepo-theme==5.0.0",
    "oarepo-ui==12.0.0",
    "oarepo-vocabularies==8.0.0",
    "oarepo-workflows==6.0.1",
    "oarepo-doi==6.0.0",
    "oarepo-related-resources==3.0.0",
]
ccmm = [
    "ccmm-invenio==1.1.12",
]
oaipmh-harvester = [
    "oarepo-oai-pmh-harvester==9.0.0",
]
llm = [
    "oarepo-checks==1.0.0"
]

[project.entry-points."invenio_config.module"]
oarepo_app = "oarepo_app.workarounds"

[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/oarepo_app",
]

[tool.hatch.build.targets.sdist]
include = [
    "src/oarepo_app",
]

[tool.oarepo]
default_extras = "development,tests,oarepo14"

[tool.oarepo.github.01-ccmm]
org = "nrp-cz"
include = "ccmm-invenio"
branch = "main"

[tool.oarepo.github.02-oarepo]
org = "oarepo"
package = "oarepo-invenio-typing-stubs"
repository = "invenio-typing-stubs"

[tool.oarepo.github.03-oarepo]
org = "oarepo"
package = "oarepo-oai-pmh-harvester"
repository = "oarepo-oaipmh-harvester"

[tool.oarepo.github.04-oarepo]
org = "oarepo"
include = "oarepo-.*"
branch = "main"

[tool.uv.sources]
