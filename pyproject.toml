[project]
name = "oarepo-app"
version = "5.0.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Miroslav Simek", email = "3385642+mesemus@users.noreply.github.com" },
]
requires-python = ">=3.14"
dependencies = [
    "json5",
]

[project.optional-dependencies]
ccmm-development = [
    "ccmm-invenio>=1.1.0,<1.2.0",
]
development = [
    "oarepo[s3]>=14.2.1b10dev7,<15.0.0",
    "marshmallow-i18n-messages>=0.1.0,<1.0.0",
    "oarepo-communities>=8.1.3,<9.0.0",
    "oarepo-dashboard>=5.0.0,<6.0.0",
    "oarepo-glitchtip>=1.3.0,<2.0.0",
    "oarepo-invenio-typing-stubs>=0.1.31,<1.0.0",
    "oarepo-model>=2.4.0,<3.0.0",
    "oarepo-oidc-einfra>=4.1.0,<5.0.0",
    "oarepo-rdm>=4.0.0,<5.0.0",
    "oarepo-requests>=5.4.0,<6.0.0",
    "oarepo-runtime>=4.5.0,<5.0.0",
    "oarepo-theme>=3.0.0,<4.0.0",
    "oarepo-ui>=10.2.0,<11.0.0",
    "oarepo-vocabularies>=6.0.0,<7.0.0",
    "oarepo-workflows>=4.1.0,<5.0.0",
    "oarepo-doi>=4.0.1,<5.0.0",
]
oarepo14 = [
    "oarepo[rdm,tests]>=14.0.0,<15.0.0",
]
tests = [
    "pytest",
    "pytest-oarepo>=3,<4",
]
production = [
    "oarepo[s3]==14.2.1b10.dev7+2.rdm.14.0.0b10.dev7",
    "marshmallow-i18n-messages==0.4.0",
    "oarepo-communities==8.1.3",
    "oarepo-dashboard==5.0.0",
    "oarepo-glitchtip==1.3.0",
    "oarepo-invenio-typing-stubs==0.1.31",
    "oarepo-model==2.4.0",
    "oarepo-oidc-einfra==4.1.0",
    "oarepo-rdm==4.0.0",
    "oarepo-requests==5.4.0",
    "oarepo-runtime==4.5.0",
    "oarepo-theme==3.0.0",
    "oarepo-ui==10.2.0",
    "oarepo-vocabularies==6.0.0",
    "oarepo-workflows==4.1.0",
    "oarepo-doi==4.0.1",
]
ccmm = [
    "ccmm-invenio==1.1.9",
]

[project.entry-points."invenio_config.module"]
oarepo_app = "oarepo_app.workarounds"

[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/oarepo_app",
]

[tool.hatch.build.targets.sdist]
include = [
    "src/oarepo_app",
]

[tool.oarepo]
default_extras = "development,tests,oarepo14"

[tool.oarepo.github.01-ccmm]
org = "nrp-cz"
include = "ccmm-invenio"
branch = "main"

[tool.oarepo.github.02-oarepo]
org = "oarepo"
package = "oarepo-invenio-typing-stubs"
repository = "invenio-typing-stubs"

[tool.oarepo.github.03-oarepo]
org = "oarepo"
include = "oarepo-.*"
branch = "main"

[tool.uv.sources]
