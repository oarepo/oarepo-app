[project]
name = "oarepo-app"
version = "6.2.0rc1"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Miroslav Simek", email = "3385642+mesemus@users.noreply.github.com" },
]
requires-python = ">=3.14"
dependencies = [
    "json5",
]

[project.urls]
Homepage = "https://github.com/oarepo/oarepo-app"

[project.optional-dependencies]
ccmm-development = [
    "ccmm-invenio>=1.1.0,<1.2.0",
]
oaipmh-harvester-development = [
    "oarepo-oai-pmh-harvester>=8.0.0,<9.0.0",
]
development = [
    "oarepo[s3]>=14.2.1b10dev7,<15.0.0",
    "marshmallow-i18n-messages>=0.1.0,<1.0.0",
    "oarepo-communities>=9.0.0,<10.0.0",
    "oarepo-dashboard>=6.0.0,<7.0.0",
    "oarepo-glitchtip>=1.3.0,<2.0.0",
    "oarepo-invenio-typing-stubs>=0.1.31,<1.0.0",
    "oarepo-model>=3.0.0,<4.0.0",
    "oarepo-oidc-einfra>=5.0.0,<6.0.0",
    "oarepo-rdm>=6.0.0,<7.0.0",
    "oarepo-requests>=7.0.0,<8.0.0",
    "oarepo-runtime>=5.0.0,<6.0.0",
    "oarepo-theme>=4.0.0,<5.0.0",
    "oarepo-ui>=11.0.0,<12.0.0",
    "oarepo-vocabularies>=7.0.0,<8.0.0",
    "oarepo-workflows>=5.0.0,<6.0.0",
    "oarepo-doi>=5.0.0,<6.0.0",
    "oarepo-related-resources>=2.0.0,<3.0.0",
]
oarepo14 = [
    "oarepo[rdm,tests]>=14.0.0,<15.0.0",
]
tests = [
    "pytest",
    "pytest-oarepo>=5,<6",
]
production = [
    "oarepo[s3]==14.2.1b11.dev1+2.rdm.14.0.0b11.dev1",
    "marshmallow-i18n-messages==0.4.0",
    "oarepo-communities==9.0.0",
    "oarepo-dashboard==6.0.0",
    "oarepo-glitchtip==1.3.0",
    "oarepo-invenio-typing-stubs==0.1.31",
    "oarepo-model==3.0.0",
    "oarepo-oidc-einfra==5.0.0",
    "oarepo-rdm==6.0.0",
    "oarepo-requests==7.0.0",
    "oarepo-runtime==5.0.0",
    "oarepo-theme==4.0.0",
    "oarepo-ui==11.0.0",
    "oarepo-vocabularies==7.0.0",
    "oarepo-workflows==5.0.0",
    "oarepo-doi==5.0.0",
    "oarepo-related-resources==2.0.0",
]
ccmm = [
    "ccmm-invenio==1.1.10",
]
oaipmh-harvester = [
    "oarepo-oai-pmh-harvester==8.0.0",
]

[project.entry-points."invenio_config.module"]
oarepo_app = "oarepo_app.workarounds"

[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/oarepo_app",
]

[tool.hatch.build.targets.sdist]
include = [
    "src/oarepo_app",
]

[tool.oarepo]
default_extras = "development,tests,oarepo14"

[tool.oarepo.github.01-ccmm]
org = "nrp-cz"
include = "ccmm-invenio"
branch = "main"

[tool.oarepo.github.02-oarepo]
org = "oarepo"
package = "oarepo-invenio-typing-stubs"
repository = "invenio-typing-stubs"

[tool.oarepo.github.03-oarepo]
org = "oarepo"
package = "oarepo-oai-pmh-harvester"
repository = "oarepo-oaipmh-harvester"

[tool.oarepo.github.04-oarepo]
org = "oarepo"
include = "oarepo-.*"
branch = "main"

[tool.uv.sources]
